name: Keep app awake

# Streamlit Community Cloud puts idle apps to sleep. A plain HTTP ping does not
# count as a visit, so this opens the app in a real headless browser and presses
# the wake button if the sleep page is showing.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

env:
  APP_URL: https://diabetesrisk-screening.streamlit.app/

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.64.1 && python -m playwright install --with-deps chromium
      - name: Visit the app
        run: |
          python - <<'EOF'
          import os, re
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60_000)
              page.wait_for_timeout(8_000)
              wake = page.get_by_role("button", name=re.compile("get this app back up", re.I))
              if wake.count():
                  print("App was asleep: pressing the wake button")
                  wake.first.click()
                  page.wait_for_timeout(90_000)  # give the container time to boot
              else:
                  print("App was awake")
              # The app renders inside an iframe; its page title reaches the outer tab.
              page.wait_for_function("document.title.includes('SugarScope')", timeout=120_000)
              print("App is up:", page.title())
          EOF
